name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-version -- "$GITHUB_REF_NAME"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:ext

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --title "$GITHUB_REF_NAME"
          --generate-notes

      - name: Submit the new version to addons.mozilla.org
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: >
          npx web-ext sign
          --channel listed
          --source-dir dist/firefox
          --artifacts-dir dist/signed
          --api-key "$AMO_JWT_ISSUER"
          --api-secret "$AMO_JWT_SECRET"
          --approval-timeout 0

      - name: Note when AMO submission is skipped
        if: env.AMO_JWT_ISSUER == '' || env.AMO_JWT_SECRET == ''
        run: echo "AMO_JWT_ISSUER or AMO_JWT_SECRET is not set, AMO submission skipped."
